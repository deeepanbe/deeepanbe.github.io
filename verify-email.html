<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ AI — Verify email</title><link rel="stylesheet" href="app/styles.css"></head><body><main><section><h1>Email verification</h1><p id="msg">Verifying your account...</p><a href="login.html">Continue to sign in</a></section></main><script src="dj/dj-config.js"></script><script src="app/dj-platform.js"></script><script>(async()=>{try{const t=new URLSearchParams(location.search).get('token');if(!t)throw new Error('Missing verification token');const r=await DJPlatform.request('/auth/verify?token='+encodeURIComponent(t));msg.className='success';msg.textContent=r.message}catch(e){msg.className='error';msg.textContent=e.message}})()</script></body></html>
