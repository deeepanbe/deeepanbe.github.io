services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: djai
      POSTGRES_USER: djai
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - djai_pgdata:/var/lib/postgresql/data
      - ./migrations/001_platform.sql:/docker-entrypoint-initdb.d/001_platform.sql:ro

  api:
    build: .
    depends_on:
      - postgres
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://djai:change-me@postgres:5432/djai
      DATABASE_SSL: "false"
      PORT: 8787

volumes:
  djai_pgdata:
