<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ AI — Create account</title><link rel="stylesheet" href="app/styles.css"></head><body><main><div class="nav"><a href="index.html">Home</a><a href="login.html">Sign in</a></div><section><h1>Create your DJ AI account</h1><p class="muted">Your account unlocks persistent conversations, memory, workspaces, RAG and usage tracking.</p><form id="form"><label>Name<input id="name" maxlength="120" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="10" required></label><button>Create account</button></form><p id="msg"></p></section></main><script src="dj/dj-config.js"></script><script src="app/dj-platform.js"></script><script>form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Creating account...';try{const r=await DJPlatform.register({displayName:name.value,email:email.value,password:password.value});msg.className='success';msg.textContent=r.delivered?'Account created. Check your email to verify it.':'Account created. Development verification link: '+r.verification_url}catch(err){msg.className='error';msg.textContent=err.message}})</script></body></html>
