<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ AI — Beta Feedback</title><link rel="stylesheet" href="app/styles.css"></head><body><main><div class="nav"><a href="beta.html">DJ AI Beta</a><a href="index.html">Portfolio</a></div><section><h1>Help improve DJ AI</h1><p>Your feedback helps decide what we build next.</p><form id="form"><label>What did you try?<textarea id="experience" rows="6" required></textarea></label><label>How useful was it?<select id="rating"><option>Very useful</option><option>Useful</option><option>Mixed</option><option>Not useful</option></select></label><label>What should we improve?<textarea id="improve" rows="5"></textarea></label><button>Submit feedback</button></form><p id="msg"></p></section></main><script>form.addEventListener('submit',e=>{e.preventDefault();const key='dj_beta_feedback';const data=JSON.parse(localStorage.getItem(key)||'[]');data.push({experience:experience.value,rating:rating.value,improve:improve.value,createdAt:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(data));msg.className='success';msg.textContent='Thank you for helping improve DJ AI.';form.reset()})</script></body></html>
