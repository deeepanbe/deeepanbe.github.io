<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ AI Workspace | Deepanraj Arumugam</title>
  <meta name="description" content="DJ AI is Deepanraj Arumugam's portfolio copilot for SQL, Python, Excel, Power BI DAX, dashboard recommendations, data cleaning, resume review, and project explanations.">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dj.css">
</head>
<body>
  <div class="workspace">
    <aside class="sidebar" aria-label="DJ AI workspace navigation">
      <a class="brand" href="../">
        <span>DA</span>
        <div>
          <strong>Deepanraj</strong>
          <small>AI Analytics Portfolio</small>
        </div>
      </a>

      <button class="new-chat" type="button" data-new-chat>New Chat</button>

      <nav class="mode-list" aria-label="Assistant modes">
        <button class="mode active" type="button" data-mode="chat">Portfolio Chat</button>
        <button class="mode" type="button" data-mode="sql">SQL Assistant</button>
        <button class="mode" type="button" data-mode="python">Python Assistant</button>
        <button class="mode" type="button" data-mode="excel">Excel Helper</button>
        <button class="mode" type="button" data-mode="dax">Power BI DAX</button>
        <button class="mode" type="button" data-mode="dashboard">Dashboard Engine</button>
        <button class="mode" type="button" data-mode="cleaning">Data Cleaning</button>
        <button class="mode" type="button" data-mode="upload">Dataset Upload</button>
        <button class="mode" type="button" data-mode="resume">Resume Fit</button>
      </nav>

      <section class="history-block" aria-label="Chat history">
        <div class="history-title">Chat History</div>
        <div class="history-list" data-history-list></div>
      </section>

      <a class="portfolio-link" href="../">Back to Portfolio</a>
    </aside>

    <main class="chat-shell">
      <header class="chat-header">
        <div>
          <strong>DJ AI</strong>
          <span>Recruiter and client-facing analytics copilot</span>
        </div>
        <div class="status-pill"><span></span> Local + backend-ready</div>
      </header>

      <section class="messages" id="dj-messages" aria-live="polite">
        <article class="message assistant">
          <div class="avatar">DJ</div>
          <div class="bubble" id="greeting-bubble"></div>
        </article>
      </section>

      <section class="quick-prompts" id="dj-suggestions" aria-label="Quick prompts"></section>

      <section class="upload-zone" id="dj-upload-zone" hidden>
        <div class="upload-card">
          <strong>Dataset Upload Shell</strong>
          <p>Select CSV, XLSX, or JSON. The static portfolio explains the workflow; backend analysis activates when the API is connected.</p>
          <input type="file" id="file-input" accept=".csv,.xlsx,.json">
          <button type="button" data-file-button>Choose File</button>
        </div>
      </section>

      <form class="composer" data-chat-form>
        <textarea id="dj-input" rows="1" placeholder="Ask DJ about Deepanraj's projects, SQL, Python, Excel, DAX, dashboards, or resume fit"></textarea>
        <button type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"></path></svg>
        </button>
      </form>
    </main>
  </div>

  <script src="dj-config.js"></script>
  <script src="dj.js"></script>
</body>
</html>
