<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ AI — Sign in</title><link rel="stylesheet" href="app/styles.css"></head><body><main><div class="nav"><a href="index.html">Home</a><a href="signup.html">Create account</a></div><section><h1>Sign in to DJ AI</h1><form id="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button></form><p id="msg"></p></section></main><script src="dj/dj-config.js"></script><script src="app/dj-platform.js"></script><script>form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in...';try{await DJPlatform.login(email.value,password.value);location.href='dashboard.html'}catch(err){msg.className='error';msg.textContent=err.message}})</script></body></html>
