name: DJ Portfolio Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - ".github/workflows/repo-audit.yml"
      - "github-ai/**"
      - "product/**"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: dj-portfolio-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit public repositories
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          repos = get(f"https://api.github.com/users/{owner}/repos?per_page=100&type=public")
          rows = []
          for repo in repos:
              name = repo["name"]
              try:
                  get(f"https://api.github.com/repos/{owner}/{name}/contents/README.md")
                  has_readme = True
              except Exception:
                  has_readme = False
              rows.append({
                  "repo": repo["full_name"],
                  "default_branch": repo["default_branch"],
                  "size_kb": repo["size"],
                  "has_readme": has_readme,
                  "language": repo["language"],
              })

          with open("repo-audit.json", "w", encoding="utf-8") as f:
              json.dump(rows, f, indent=2)
          print(json.dumps(rows, indent=2))
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dj-portfolio-audit
          path: repo-audit.json
