name: DJ GitHub AI CI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "github-ai/**"
      - ".github/workflows/dj-github-ai-ci.yml"
  pull_request:
    paths:
      - "github-ai/**"
      - ".github/workflows/dj-github-ai-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-ai/package.json
      - run: npm install --ignore-scripts
      - run: npm test