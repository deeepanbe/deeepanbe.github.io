name: DJ CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: Optional DJ Agent task
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dj-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend smoke test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: github-ai/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py
      - name: Flask health smoke test
        run: python -c "from app import app; r=app.test_client().get('/health'); assert r.status_code == 200 and r.json['ok']"

  job-profile:
    name: Job profile tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-profile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-profile/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  repo-assistant:
    name: AI pull-request review
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo-assistant/requirements.txt
      - run: pip install -r repo-assistant/requirements.txt
      - name: Generate review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python repo-assistant/agent.py > review.md
      - name: Publish review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dj-repo-review-${{ github.run_id }}
          path: review-result.json
          if-no-files-found: ignore

  agent-loop:
    name: Bounded agent-loop smoke test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: github-ai
        run: |
          python agent_loop_test.py
          python -m py_compile agent_loop.py

  portfolio-audit:
    name: Public portfolio audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit public repositories
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          repos = get(f"https://api.github.com/users/{owner}/repos?per_page=100&type=public")
          rows = []
          for repo in repos:
              try:
                  get(f"https://api.github.com/repos/{owner}/{repo['name']}/contents/README.md")
                  has_readme = True
              except Exception:
                  has_readme = False
              rows.append({
                  "repo": repo["full_name"],
                  "default_branch": repo["default_branch"],
                  "size_kb": repo["size"],
                  "has_readme": has_readme,
                  "language": repo["language"],
              })

          with open("repo-audit.json", "w", encoding="utf-8") as f:
              json.dump(rows, f, indent=2)
          print(f"Audited {len(rows)} public repositories")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dj-portfolio-audit-${{ github.run_id }}
          path: repo-audit.json
