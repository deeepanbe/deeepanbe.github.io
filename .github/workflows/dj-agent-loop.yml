name: DJ Agent Loop
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Engineering task"
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  agent-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run bounded loop smoke test
        working-directory: github-ai
        run: |
          python agent_loop_test.py
          python -m py_compile agent_loop.py
