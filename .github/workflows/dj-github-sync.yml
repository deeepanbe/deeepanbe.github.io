name: DJ GitHub Knowledge Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - name: Configuration note
        run: echo "DJ GitHub sync runs only when DJ_BACKEND_URL and DJ_SYNC_JWT repository secrets are configured."
  sync:
    if: ${{ secrets.DJ_BACKEND_URL != '' && secrets.DJ_SYNC_JWT != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DJ backend GitHub sync
        run: |
          curl -X POST "${{ secrets.DJ_BACKEND_URL }}/sync/github" \
            -H "Authorization: Bearer ${{ secrets.DJ_SYNC_JWT }}" \
            -H "Content-Type: application/json"
