name: DJ AI Platform CI

on:
  push:
    paths:
      - 'backend/**'
      - 'app/**'
      - 'extension/**'
      - 'android/**'
      - '.github/workflows/dj-platform-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'app/**'
      - 'extension/**'
      - 'android/**'
      - '.github/workflows/dj-platform-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high