name: DJ AI Platform CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'backend/**'
      - 'app/**'
      - 'extension/**'
      - 'android/**'
      - '.github/workflows/dj-platform-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'app/**'
      - 'extension/**'
      - 'android/**'
      - '.github/workflows/dj-platform-ci.yml'

permissions:
  contents: read

concurrency:
  group: dj-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
