<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ AI — Plans</title><link rel="stylesheet" href="app/styles.css"></head><body><main><div class="nav"><a href="dashboard.html">Dashboard</a><a href="index.html">Home</a></div><section><h1>DJ AI plans</h1><div class="row"><div class="card"><h2>Free</h2><p>Basic account and limited usage.</p></div><div class="card"><h2>Pro</h2><p>Persistent AI, memory, RAG and higher usage.</p><button data-plan="pro">Choose Pro</button></div><div class="card"><h2>Team</h2><p>Shared workspaces and team-oriented limits.</p><button data-plan="team">Choose Team</button></div></div><p id="msg"></p></section></main><script src="dj/dj-config.js"></script><script src="app/dj-platform.js"></script><script>document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=async()=>{msg.textContent='Preparing secure checkout...';try{const r=await DJPlatform.billing(b.dataset.plan);location.href=r.checkout_url}catch(e){msg.className='error';msg.textContent=e.message}})</script></body></html>
