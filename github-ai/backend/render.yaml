services:
  - type: web
    name: dj-ai-api
    runtime: python
    rootDir: github-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: GITHUB_OWNER
        value: deeepanbe
      - key: MODEL
        value: gpt-5.6-luna
      - key: STATE_FILE
        value: /tmp/dj-agent-state.json
