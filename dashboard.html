<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ AI — Dashboard</title><link rel="stylesheet" href="app/styles.css"></head><body><main><div class="nav"><a href="index.html">Home</a><a href="billing.html">Plans</a><button id="logout" class="secondary">Sign out</button></div><section><h1>DJ AI Dashboard</h1><p id="who" class="muted"></p></section><div class="row"><section><h2>Workspaces</h2><select id="workspace"></select><input id="newWorkspace" placeholder="New workspace name"><button id="createWorkspace">Create workspace</button></section><section><h2>Agent</h2><textarea id="task" rows="5" placeholder="Try: calculate 18*42 or ask a technical question"></textarea><button id="run">Run agent</button><pre id="agentResult"></pre></section></div><section><h2>Knowledge / RAG</h2><input id="docName" placeholder="document name"><textarea id="doc" rows="8" placeholder="Paste text to index into your workspace"></textarea><button id="upload">Index document</button><p id="uploadMsg"></p></section><section><h2>Persistent conversations</h2><button id="newConversation">Create conversation</button><div id="conversations"></div></section></main><script src="dj/dj-config.js"></script><script src="app/dj-platform.js"></script><script>const $=id=>document.getElementById(id);let currentWorkspace='';async function init(){try{const r=await DJPlatform.me();$('who').textContent=r.user.display_name||r.user.email;const w=await DJPlatform.workspaces();$('workspace').innerHTML=w.workspaces.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');currentWorkspace=w.workspaces[0]?.id||'';await refresh()}catch(e){location.href='login.html'}}async function refresh(){currentWorkspace=$('workspace').value||currentWorkspace;const r=await DJPlatform.conversations(currentWorkspace);$('conversations').innerHTML=r.conversations.map(c=>`<div class="card"><strong>${c.title}</strong><div class="muted">${c.provider} · ${c.model}</div></div>`).join('')||'<p class="muted">No conversations yet.</p>'}$('workspace').addEventListener('change',refresh);$('logout').onclick=()=>DJPlatform.logout();$('createWorkspace').onclick=async()=>{await DJPlatform.createWorkspace($('newWorkspace').value);location.reload()};$('newConversation').onclick=async()=>{await DJPlatform.createConversation(currentWorkspace,'New conversation');await refresh()};$('run').onclick=async()=>{try{const r=await DJPlatform.agent($('task').value);$('agentResult').textContent=JSON.stringify(r,null,2)}catch(e){$('agentResult').textContent=e.message}};$('upload').onclick=async()=>{try{const r=await DJPlatform.uploadText(currentWorkspace,$('docName').value||'document.txt',$('doc').value);$('uploadMsg').className='success';$('uploadMsg').textContent='Indexed: '+r.document_id}catch(e){$('uploadMsg').className='error';$('uploadMsg').textContent=e.message}};init();</script></body></html>
